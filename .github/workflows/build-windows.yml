name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build standalone EXE
        run: python build.py
      - name: Upload Windows game
        uses: actions/upload-artifact@v4
        with:
          name: GhostOfSpace-Windows-x64
          path: dist/GhostOfSpace.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GhostOfSpace-Windows-x64
      - name: Publish Windows download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" GhostOfSpace.exe
          --verify-tag --title "Ghost of Space $RELEASE_TAG"
          --notes "Windows x64: download GhostOfSpace.exe and launch it. Python is not required."

name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build standalone EXE
        run: python build.py
      - name: Upload Windows game
        uses: actions/upload-artifact@v4
        with:
          name: GhostOfSpace-Windows-x64
          path: dist/GhostOfSpace.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
